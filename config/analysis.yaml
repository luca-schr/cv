# Configuration de l'analyse des fiches de poste (toute source : URL, Indeed, LinkedIn, texte brut).

scoring:
  experience_title_tag_weight: 3
  profil_keyword_limit: 12

noise_substrings:
  - indeed
  - linkedin
  - hiring lab
  - welcome to the jungle
  - hellowork
  - apec.fr
  - "© 20"
  - cookies
  - conditions d'utilisation
  - centre de confidentialité
  - politique de confidentialité
  - début du contenu principal
  - correspondance entre ce poste
  - extraits de la description
  - emplois 
  - salaires de
  - logo
  - étoiles
  - "&nbsp;"
  - signalement dsa
  - accessibilité sur indeed
  - just a moment
  - cloudflare

title_hints:
  - développeur
  - developer
  - ingénieur
  - engineer
  - webmaster
  - intégrateur
  - integrateur
  - chef de projet
  - consultant
  - designer
  - lead
  - product owner
  - fullstack
  - full stack
  - full-stack
  - administrateur
  - analyste
  - chargé
  - chargee

title_skip:
  - emplois 
  - salaires
  - logo
  - étoiles
  - critères candidat
  - description du poste
  - vos missions
  - détails de l'emploi
  - avantages
  - type de poste
  - lieu
  - quoi
  - où

# Si aucun titre extrait : premier tag_set qui matche entièrement.
title_fallbacks:
  - tags: [cyber]
    title: Développeur Fullstack JavaScript / .NET - Cybersécurité
  - tags: [webmaster, cms]
    title: Webmaster
  - tags: [integrateur, wordpress]
    title: Intégrateur WordPress
  - tags: [fullstack, react]
    title: Développeur Fullstack JavaScript / .NET

